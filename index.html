<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C5A">
<meta name="description" content="BeatBook — offline, voice-first order taking for FMCG field reps. On-device AI.">
<title>BeatBook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --surface-2:#FBFAF7; --ink:#16201C; --muted:#5E6B66; --line:#E3E1DA;
  --accent:#0E7C5A; --accent-ink:#FFFFFF; --accent-soft:#E3F2EC;
  --warn:#9A4A06; --warn-soft:#FDF0DC; --danger:#B42318; --danger-soft:#FDE7E5;
  --radius:16px; --shadow:0 1px 2px rgba(22,32,28,.06),0 4px 16px rgba(22,32,28,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1513; --surface:#18201D; --surface-2:#141B18; --ink:#E8EEEB; --muted:#9AA8A2; --line:#2A3430;
    --accent:#34B987; --accent-ink:#04130D; --accent-soft:#163A2D;
    --warn:#F0B054; --warn-soft:#3A2A12; --danger:#F07167; --danger-soft:#3D1A18;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:-.01em;font-size:19px}
.brand img{width:28px;height:28px;border-radius:8px}
.top .sub{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
main{flex:1;padding:14px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:650}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:15px;margin:6px 2px 0;color:var(--muted);font-weight:650;letter-spacing:.02em;text-transform:uppercase}
h1.title{font-size:22px;margin:0;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.01em}
.kpi span{font-size:12px;color:var(--muted)}
.outlet{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow)}
.outlet .num{width:32px;height:32px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.outlet .meta{flex:1;min-width:0}
.outlet .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outlet .chev{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn.sm{min-height:36px;padding:7px 11px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.mic{width:104px;height:104px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 24px rgba(14,124,90,.35);position:relative}
.mic svg{width:42px;height:42px}
.mic.rec{background:var(--danger);box-shadow:0 6px 24px rgba(180,35,24,.35)}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--danger);opacity:.5;animation:pulse 1.2s ease-out infinite}
.mic.busy{opacity:.7}
@keyframes pulse{from{transform:scale(.95);opacity:.6}to{transform:scale(1.18);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.rec::after{animation:none}}
.status{min-height:22px;font-size:14px;color:var(--muted);text-align:center}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px 12px;resize:vertical;min-height:64px}
select{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 10px;min-height:42px;width:100%}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .info{flex:1;min-width:0}
.line .pname{font-weight:620}
.line .flag{color:var(--warn);font-size:12.5px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{width:34px;height:36px;border:0;background:var(--surface-2);font-size:18px;font-weight:700}
.stepper .q{min-width:58px;text-align:center;font-weight:650;font-size:14px;line-height:1.1}
.stepper .q small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.x{border:0;background:none;color:var(--muted);font-size:20px;width:30px;height:36px}
.badge{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;display:inline-block}
.badge.rule{color:var(--warn);background:var(--warn-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px}
.footer-actions{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.footer-actions .inner{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.back{border:0;background:none;display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:0}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;word-break:break-word}
.log{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.report-outlet{padding:10px 0;border-top:1px solid var(--line)}
.report-outlet:first-child{border-top:0}
.report-outlet ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 4px;font-size:14px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.about-btn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.sheet-bg{position:fixed;inset:0;background:rgba(8,14,12,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet{background:var(--surface);color:var(--ink);border-radius:22px;max-width:520px;width:100%;padding:20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:92dvh;overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.print-only{display:none}
@media print{
  header.top,nav.tabs,.no-print,.toast{display:none!important}
  main{padding:0}
  .print-only{display:block}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="icon-192.png" alt="">BeatBook</div>
    <div class="sub" id="topSub"></div>
    <button class="about-btn no-print" data-act="about" aria-label="About BeatBook">?</button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs no-print" id="tabs">
  <div class="inner">
    <button data-tab="beat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>Beat</button>
    <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>Report</button>
    <button data-tab="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>On-device AI</button>
  </div>
</nav>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
